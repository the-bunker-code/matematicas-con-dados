# Integración continua: en cada pull request y en cada push a main.
# Nada de esto se publica: el sitio sigue siendo los archivos tal como están.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, formato, tipos y pruebas unitarias
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:syntax
      - run: npm run validate:html
      - run: npm run test:coverage

  e2e:
    name: Recorridos en el navegador (Playwright)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (móvil)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # El servidor local aplica las cabeceras de _headers y comprime con gzip,
      # como el hosting. Las metas están en lighthouserc.json.
      - run: npx --yes @lhci/cli@0.14.0 autorun
